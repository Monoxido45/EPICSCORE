[project]
name = "Epistemic_CP"
version = "0.1.0"
description = "Epistemic Conformal Prediction"
authors = [
    {name = "Luben M. C. Cabezas",email = "lucruz45.cab@gmail.com"},
    {name = "Vagner S. Santos}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=1.26.4,<2.0.0)",
    "scikit-learn (==1.5.1)",
    "scipy (==1.14.1)",
    "matplotlib (==3.9.2)",
    "tqdm (==4.66.5)",
    "torch (>=2.3.1,<3.0.0)",
    "gpytorch (>=1.13,<2.0)",
    "pymc (>=5.23.0,<6.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^6.2"
black = "^21.7b0"
flake8 = "^3.9"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
